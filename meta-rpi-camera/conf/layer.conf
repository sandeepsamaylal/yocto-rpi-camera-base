# We have a conf and classes directory, add to BBPATH.
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES.
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi-camera"
BBFILE_PATTERN_rpi-camera = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi-camera = "6"

LAYERSERIES_COMPAT_rpi-camera = "scarthgap styhead walnascar"
